name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Nginx
        run: |
          sudo mkdir -p /var/www/Personal-Website/dist
          sudo rm -rf /var/www/Personal-Website/dist/*
          sudo cp -r dist/* /var/www/Personal-Website/dist/
