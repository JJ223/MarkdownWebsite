# ─────────────────────────────────────────────────────────────────────────────
# Nginx config for the personal site (served from the built `dist/`).
#
# Apply on the server: merge the `gzip` block + the `location` blocks into your
# existing server { } in /etc/nginx/sites-available/<your-site>, then:
#     sudo nginx -t && sudo systemctl reload nginx
#
# Caching strategy (matches the dist/ layout):
#   /assets/*  → content-hashed by Vite, safe to cache for a year (immutable)
#   /images/*  → stable names that can be replaced, short cache (purge on swap)
#   /docs/*    → .md/.json content that changes every deploy, always revalidate
#   index.html → entry point, always revalidate so new deploys are picked up
#
# Note: when proxied through Cloudflare, the edge handles Brotli to clients and
# caches /assets and images globally. These origin headers tell Cloudflare what
# it may cache and keep direct-to-origin hits fast too.
# ─────────────────────────────────────────────────────────────────────────────

# --- Compression (http {} or server {} level) -------------------------------
gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_types        text/plain text/css application/javascript application/json
                  image/svg+xml application/manifest+json;
# text/html is always compressed when gzip is on.

server {
    # listen / server_name / SSL are managed by your existing config (or by
    # Cloudflare's edge). Keep your current values; only the blocks below matter.

    root /var/www/Personal-Website/dist;
    index index.html;

    # Hashed build assets — immutable, cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images — stable filenames that occasionally get replaced. Short cache so a
    # swapped image is picked up within a day (and you can purge Cloudflare).
    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Markdown + generated JSON indexes — change on every deploy. Revalidate so
    # new posts/edits show immediately. (=404 keeps the app's "not found" logic.)
    location /docs/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Entry HTML — always revalidate so a new deploy isn't served stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for navigations (hash router only ever requests "/").
    location / {
        try_files $uri /index.html;
    }
}
