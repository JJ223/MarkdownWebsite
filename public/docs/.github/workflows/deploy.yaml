Create .github/workflows/deploy.yml in your repo with this:

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Nginx
        run: |
          sudo rm -rf /var/www/Personal-Website
          sudo cp -r dist/ /var/www/Personal-Website

      - name: Reload Nginx
        run: sudo systemctl reload nginx